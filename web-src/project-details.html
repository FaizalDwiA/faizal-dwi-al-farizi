<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details — Faizal Dwi Al Farizi</title>
  <meta name="description" content="Detail spesifikasi teknis, fitur utama, galeri gambar, dan demo proyek spreadsheets, rekayasa perangkat lunak, serta IT oleh Faizal Dwi Al Farizi." />

  <!-- Open Graph Page Specific -->
  <meta property="og:title" content="Project Details — Faizal Dwi Al Farizi" />
  <meta property="og:description" content="Informasi mendalam dan dokumentasi fitur dari proyek spreadsheets, rekayasa sistem, dan IT oleh Faizal Dwi Al Farizi." />

  <!-- Twitter Page Specific -->
  <meta property="twitter:title" content="Project Details — Faizal Dwi Al Farizi" />
  <meta property="twitter:description" content="Informasi mendalam dan dokumentasi fitur dari proyek spreadsheets, rekayasa sistem, dan IT oleh Faizal Dwi Al Farizi." />

  <!-- Common Meta, Fonts, PWA, SW & Favicons -->
  <load src="src/partials/head-common.html" />

  <style>
    :root {
      --bg: #080c10;
      --bg2: #0d1117;
      --bg3: #111820;
      --card: #0f1923;
      --border: #1e2d3d;
      --accent: #00d4ff;
      --accent2: #7ee787;
      --accent3: #ff6b6b;
      --accent4: #ffd700;
      --text: #cdd9e5;
      --text-muted: #768390;
      --text-dim: #444c56;
      --glow: 0 0 20px rgba(0, 212, 255, 0.3);
      --glow2: 0 0 30px rgba(0, 212, 255, 0.15);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    /* ── CUSTOM HARDWARE CURSOR (Futuristic Developer theme) ── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      cursor: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28' fill='none'%3E%3Cpath d='M2 2l20 8-10 2-2 10-8-20z' fill='%23080c10' stroke='%2300d4ff' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M5 5l11 4-5.5 1-1 5.5-3.5-10.5z' fill='%2300d4ff'/%3E%3C/svg%3E") 2 2, auto;
    }

    /* Glowing Neon Green Pointer for Interactive Elements */
    a, button, [role="button"], 
    input[type="submit"], input[type="button"], select,
    .swiper-btn, .swiper-dot, .tech-badge, .swiper-slide, .swiper-thumbnail {
      cursor: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28' fill='none'%3E%3Cpath d='M2 2l20 8-10 2-2 10-8-20z' fill='%23080c10' stroke='%237ee787' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M5 5l11 4-5.5 1-1 5.5-3.5-10.5z' fill='%237ee787'/%3E%3C/svg%3E") 2 2, pointer !important;
    }

    /* ── CUSTOM CURSOR ── */
    .cursor {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.05s linear, opacity 0.2s ease;
      box-shadow: var(--glow);
    }

    .cursor-ring {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(0, 212, 255, 0.5);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.1s ease, width 0.2s, height 0.2s, border-color 0.2s, opacity 0.2s ease;
    }

    .cursor.disintegrated,
    .cursor-ring.disintegrated {
      transform: scale(0) !important;
      opacity: 0 !important;
    }

    /* ── CODE SNAKE SEGMENTS ── */
    .cursor-segment {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9997;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      opacity: 0.75;
      text-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
      transition: color 0.25s ease, text-shadow 0.25s ease, opacity 0.25s ease;
      will-change: transform;
      user-select: none;
    }

    /* Hover effect on interactive elements */
    .cursor-segment.hovered {
      color: var(--accent2);
      opacity: 1;
      text-shadow: 0 0 10px rgba(126, 231, 135, 0.8), 0 0 15px rgba(126, 231, 135, 0.4);
    }

    /* ── FLOATING TRAIL WORDS ── */
    .cursor-trail-word {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9996;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(0, 212, 255, 0.55);
      text-shadow: 0 0 4px rgba(0, 212, 255, 0.3);
      will-change: transform, opacity;
      user-select: none;
    }

    /* ── CLICK CODE SNIPPET BURSTS ── */
    .cursor-click-snippet {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      will-change: transform, opacity;
      user-select: none;
    }

    .cursor-click-snippet.color-cyan {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.8), 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .cursor-click-snippet.color-green {
      color: var(--accent2);
      text-shadow: 0 0 8px rgba(126, 231, 135, 0.8), 0 0 15px rgba(126, 231, 135, 0.4);
    }

    .cursor-click-snippet.color-yellow {
      color: var(--accent4);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .cursor-glitch-particle {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 10000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 800;
      will-change: transform, opacity;
      user-select: none;
    }

    .cursor-glitch-particle.color-cyan {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.8), 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .cursor-glitch-particle.color-green {
      color: var(--accent2);
      text-shadow: 0 0 8px rgba(126, 231, 135, 0.8), 0 0 15px rgba(126, 231, 135, 0.4);
    }

    .cursor-glitch-particle.color-yellow {
      color: var(--accent4);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .cursor-glitch-particle.color-pink {
      color: #ff007f;
      text-shadow: 0 0 8px rgba(255, 0, 127, 0.8), 0 0 15px rgba(255, 0, 127, 0.4);
    }

    /* Hide custom cursor elements on mobile/tablet touch screens and small screens */
    @media (pointer: coarse), (max-width: 1024px) {
      .cursor,
      .cursor-ring,
      .cursor-segment,
      .cursor-trail-word,
      .cursor-click-snippet,
      .cursor-glitch-particle,
      #cursorTrailContainer,
      .lightbox-magnifier {
        display: none !important;
      }
      body {
        cursor: auto !important;
      }
      a, button, [role="button"], 
      input[type="submit"], input[type="button"], select,
      .swiper-btn, .swiper-dot, .tech-badge {
        cursor: pointer !important;
      }
    }

    /* ── GRID BACKGROUND ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 2px;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem;
      background: rgba(8, 12, 16, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--accent2);
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--accent);
    }

    .nav-back {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .nav-back:hover {
      color: var(--accent);
    }

    .nav-back::before {
      content: '←';
      color: var(--accent);
    }

    /* mobile nav toggle */
    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .nav-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text-muted);
      border-radius: 2px;
      transition: background 0.2s;
    }

    .nav-toggle:hover span {
      background: var(--accent);
    }

    @media (max-width: 768px) {
      nav {
        padding: 1rem 1.5rem;
      }

      .nav-toggle {
        display: flex;
      }
    }

    /* ── PAGE HERO (breadcrumb) ── */
    .page-hero {
      padding: 8rem 3rem 3rem;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse 60% 60% at 70% 40%, rgba(0, 212, 255, 0.04), transparent);
      pointer-events: none;
    }

    .page-hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .breadcrumb {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.6;
      display: block;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .breadcrumb a,
    .breadcrumb span {
      display: inline;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .breadcrumb .sep {
      margin: 0 0.3rem;
      color: var(--text-dim);
    }

    .breadcrumb a {
      color: var(--accent);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb .sep {
      color: var(--text-dim);
    }

    .page-hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      color: #fff;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.15;
    }

    /* ── MAIN LAYOUT ── */
    main {
      position: relative;
      z-index: 1;
    }

    .details-section {
      padding: 4rem 3rem 6rem;
    }

    .details-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 4rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .details-inner {
        grid-template-columns: minmax(0, 1fr);
        gap: 2.5rem;
      }

      .details-section {
        padding: 3rem 1.5rem 5rem;
      }

      .page-hero {
        padding: 7rem 1.5rem 2.5rem;
      }

      #swiperWrapper {
        height: 260px;
      }
    }

    @media (max-width: 480px) {
      .details-section {
        padding: 2.5rem 1rem 4rem;
      }

      .page-hero {
        padding: 6.5rem 1rem 2rem;
      }

      #swiperWrapper {
        height: 200px;
      }

      .swiper-btn {
        width: 32px;
        height: 32px;
        font-size: 0.95rem;
      }

      .swiper-btn.prev {
        left: 0.5rem;
      }

      .swiper-btn.next {
        right: 0.5rem;
      }

      .project-overview {
        padding: 1rem 1.1rem;
        font-size: 0.9rem;
      }

      .lightbox-controls {
        gap: 0.5rem;
        padding: 0.5rem 1rem;
      }

      .zoom-slider {
        width: 100px;
      }

      .lightbox-close {
        top: 15px;
        right: 20px;
        font-size: 32px;
      }

      .nav-back {
        font-size: 0.72rem;
      }

      nav {
        padding: 1rem !important;
      }

      .swiper-thumbnails {
        justify-content: flex-start !important;
      }
    }


    /* ── IMAGE / SLIDER COLUMN ── */
    .media-col {}

    .swiper-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.06), 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    #swiperWrapper {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
    }

    .swiper-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      display: block;
    }

    .swiper-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .swiper-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(8, 12, 16, 0.75);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
      z-index: 5;
    }

    .swiper-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .swiper-btn.prev {
      left: 0.8rem;
    }

    .swiper-btn.next {
      right: 0.8rem;
    }

    .swiper-dots {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.9rem 0 0.5rem;
    }

    .swiper-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      border: none;
    }

    .swiper-dot.active {
      background: var(--accent);
      transform: scale(1.3);
      box-shadow: 0 0 8px var(--accent);
    }

    /* Thumbnails Styling */
    .swiper-thumbnails {
      display: flex;
      gap: 0.6rem;
      padding: 0.5rem 0.2rem;
      margin-top: 0.2rem;
      margin-bottom: 0.5rem;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
      scroll-behavior: smooth;
      width: 100%;
    }

    .swiper-thumbnails::-webkit-scrollbar {
      height: 4px;
    }

    .swiper-thumbnails::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 2px;
    }

    .swiper-thumbnails::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 2px;
    }

    .swiper-thumbnail {
      width: 75px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .swiper-thumbnail:hover {
      opacity: 0.85;
      border-color: rgba(0, 212, 255, 0.5);
      transform: translateY(-2px);
    }

    .swiper-thumbnail.active {
      opacity: 1;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
      transform: scale(1.05);
    }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      z-index: 10001; /* Above custom cursor (9999-10000) */
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: rgba(8, 12, 16, 0.95);
      backdrop-filter: blur(15px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox-modal.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-wrapper {
      position: relative;
      display: inline-block;
      margin: auto;
      max-width: 85%;
      max-height: 75vh;
    }

    /* Modal content (Image) */
    .lightbox-content {
      margin: 0;
      display: block;
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.2);
      object-fit: contain;
      transform: scale(0.95);
      transition: transform 0.3s ease;
      cursor: crosshair !important; /* precise targeting cursor for magnifier */
    }

    .lightbox-modal.open .lightbox-content {
      transform: scale(1);
    }

    /* Magnifying glass glass lens overlay */
    .lightbox-magnifier {
      display: none;
      position: fixed; /* relative to screen viewport for smooth rendering */
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      background-repeat: no-repeat;
      z-index: 10003;
      background-color: var(--bg);
    }

    /* Cyberpunk Controls panel */
    .lightbox-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 10px;
      margin-bottom: 25px;
      padding: 0.6rem 1.4rem;
      background: rgba(15, 25, 35, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      z-index: 10002;
    }

    .control-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      color: var(--accent2);
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .zoom-slider {
      -webkit-appearance: none;
      width: 150px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      transition: background 0.2s;
      cursor: ew-resize !important;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      cursor: ew-resize !important;
      transition: transform 0.1s;
    }

    .zoom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .zoom-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent);
      font-weight: 700;
      min-width: 40px;
    }

    .lightbox-modal.open .lightbox-content {
      transform: scale(1);
    }

    /* Close Button */
    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: var(--text-muted);
      font-size: 40px;
      font-weight: 300;
      transition: color 0.2s, transform 0.2s;
      cursor: pointer;
      user-select: none;
      z-index: 10002;
    }

    .lightbox-close:hover,
    .lightbox-close:focus {
      color: var(--accent3);
      transform: scale(1.1);
    }

    /* Caption */
    .lightbox-caption {
      margin: 15px auto;
      width: 80%;
      max-width: 700px;
      text-align: center;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
    }

    .lightbox-close {
      cursor: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28' fill='none'%3E%3Cpath d='M2 2l20 8-10 2-2 10-8-20z' fill='%23080c10' stroke='%23ff6b6b' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M5 5l11 4-5.5 1-1 5.5-3.5-10.5z' fill='%23ff6b6b'/%3E%3C/svg%3E") 2 2, pointer !important;
    }

    /* Tech stack badges */
    .tech-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .tech-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(0, 212, 255, 0.07);
      border: 1px solid rgba(0, 212, 255, 0.2);
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
      transition: background 0.2s, border-color 0.2s;
    }

    .tech-badge:hover {

  <script type="module">
    import { doc, getDoc } from 'firebase/firestore';
    import { db } from './src/firebase/config.js';

    // ═══════════════════════════════════════════
    // CUSTOM CURSOR "CODE SNAKE / DRAGON"
    // ═══════════════════════════════════════════
    const cur = document.getElementById('cursor');
    const ring = document.getElementById('cursorRing');
    
    if (cur && ring) {
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let currentX = mouseX;
      let currentY = mouseY;
      let ringX = mouseX;
      let ringY = mouseY;

      document.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      let isHovered = false;

      // ── DYNAMIC SCRAMBLE/DISINTEGRATION STATE ──
      let clickState = 'normal'; // 'normal', 'scrambling', 'compiling'
      let scrambleStartTime = 0;
      let compileStartTime = 0;
      const GLYPHS = '$%&?#@*!01x_';

      // ── CODE SNAKE CONFIG ──
      const SYMBOLS = ['</>', '{ }', '=>', ';', 'const', 'dev', '[]', '&&', '||', '++', '()', '$'];
      const segments = [];
      const totalSegments = SYMBOLS.length;
      
      const trailContainer = document.createElement('div');
      trailContainer.id = 'cursorTrailContainer';
      trailContainer.style.position = 'fixed';
      trailContainer.style.top = '0';
      trailContainer.style.left = '0';
      trailContainer.style.width = '100vw';
      trailContainer.style.height = '100vh';
      trailContainer.style.pointerEvents = 'none';
      trailContainer.style.zIndex = '9997';
      document.body.appendChild(trailContainer);

      for (let i = 0; i < totalSegments; i++) {
        const el = document.createElement('span');
        el.className = 'cursor-segment';
        el.innerText = SYMBOLS[i];
        
        const size = Math.max(9, 13 - i * 0.4);
        const opacity = Math.max(0.25, 0.8 - i * 0.05);
        el.style.fontSize = `${size}px`;
        el.style.opacity = opacity;
        
        trailContainer.appendChild(el);
        
        segments.push({
          el: el,
          x: mouseX,
          y: mouseY,
          size: size,
          baseOpacity: opacity,
          originalText: SYMBOLS[i]
        });
      }

      // ── CODE/KEYWORD EMITTER TRAIL CONFIG ──
      const trailWords = [];
      const CODE_KEYWORDS = [
        'const', 'let', 'function', 'return', 'import', 'export', 'class', 
        'if', 'else', 'for', 'while', '=>', '||', '&&', '++', '--', '===', 
        '<?php', 'echo', 'public', 'private', 'async', 'await', 'try', 'catch', 
        'git add', 'git commit', 'git push', 'npm run dev', 'composer install',
        'pip install', 'python', 'javascript', 'php', 'laravel', 'mysql', 'CI3',
        'node', 'npm', 'yarn', 'docker', 'nginx', 'api', 'json', 'null', 'true', 'false'
      ];

      let lastEmitX = mouseX;
      let lastEmitY = mouseY;
      const EMIT_DISTANCE = 35; // Spawn a word every 35px of movement

      function spawnTrailWord(x, y) {
        const word = CODE_KEYWORDS[Math.floor(Math.random() * CODE_KEYWORDS.length)];
        const el = document.createElement('span');
        el.className = 'cursor-trail-word';
        el.innerText = word;
        el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        trailContainer.appendChild(el);

        const angle = (Math.random() - 0.5) * 0.5;
        const speedX = (Math.random() - 0.5) * 0.8;
        const speedY = -0.6 - Math.random() * 0.8; // float up

        trailWords.push({
          el: el,
          x: x,
          y: y,
          vx: speedX,
          vy: speedY,
          rotation: angle * 10,
          vRotation: (Math.random() - 0.5) * 0.8,
          opacity: 0.8,
          decay: 0.015 + Math.random() * 0.01
        });
      }

      // ── CLICK MUTATING GLITCH PARTICLES CONFIG ──
      const glitchParticles = [];
      const GLITCH_GLYPHS = ['0', '1', '[', ']', '{', '}', ';', '=>', '++', '--', '&&', '||', '!', '$', '?', '#', 'x', 'y', 'f', 'a'];

      document.addEventListener('click', e => {
        // 1. Trigger Scramble Disintegration State
        clickState = 'scrambling';
        scrambleStartTime = Date.now();
        
        // Hide main cursor and ring
        cur.classList.add('disintegrated');
        ring.classList.add('disintegrated');
        
        // Clear spammed click timeouts
        if (window.cursorScrambleTimeout) clearTimeout(window.cursorScrambleTimeout);
        if (window.cursorCompileTimeout) clearTimeout(window.cursorCompileTimeout);
        if (window.cursorNormalTimeout) clearTimeout(window.cursorNormalTimeout);
        
        // Compile transition (Starts after 500ms)
        window.cursorCompileTimeout = setTimeout(() => {
          clickState = 'compiling';
          compileStartTime = Date.now();
        }, 500);
        
        // Return to stable normal (Starts after compile seq finishes)
        window.cursorNormalTimeout = setTimeout(() => {
          clickState = 'normal';
          cur.classList.remove('disintegrated');
          ring.classList.remove('disintegrated');
        }, 500 + totalSegments * 45 + 120 + 50);

        // 2. Generate 15-20 Mutating Glitch Code Particles
        const count = 15 + Math.floor(Math.random() * 6);
        const colors = ['color-cyan', 'color-green', 'color-yellow', 'color-pink'];

        for (let i = 0; i < count; i++) {
          const glyph = GLITCH_GLYPHS[Math.floor(Math.random() * GLITCH_GLYPHS.length)];
          const el = document.createElement('span');
          el.className = 'cursor-glitch-particle';
          el.classList.add(colors[Math.floor(Math.random() * colors.length)]);
          el.innerText = glyph;
          
          const px = e.clientX;
          const py = e.clientY;
          el.style.transform = `translate3d(${px}px, ${py}px, 0)`;
          trailContainer.appendChild(el);
          
          // Radial explosion velocity
          const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
          const speed = 2.5 + Math.random() * 4.5;
          
          glitchParticles.push({
            el: el,
            x: px,
            y: py,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            rotation: (Math.random() - 0.5) * 30,
            vRotation: (Math.random() - 0.5) * 3.0,
            scale: 1.0,
            vScale: -0.012 - Math.random() * 0.008,
            opacity: 1.0,
            decay: 0.012 + Math.random() * 0.008,
            mutateCounter: 0
          });
        }
      });

      // ── ANIMATION PHYSICS LOOP ──
      function updateAnimation() {
        // 1. Move lead dot (disabled/hidden visually when disintegrated but physics active)
        currentX += (mouseX - currentX) * 0.95;
        currentY += (mouseY - currentY) * 0.95;
        cur.style.transform = `translate3d(${currentX - 5}px, ${currentY - 5}px, 0)`;

        // 2. Move lag ring
        ringX += (mouseX - ringX) * 0.50;
        ringY += (mouseY - ringY) * 0.50;
        ring.style.transform = `translate3d(${ringX - 18}px, ${ringY - 18}px, 0)`;

        // 3. Emit coding trail words based on movement distance (only if not disintegrated)
        const distDx = currentX - lastEmitX;
        const distDy = currentY - lastEmitY;
        const dist = Math.hypot(distDx, distDy);
        
        if (dist >= EMIT_DISTANCE && clickState === 'normal') {
          spawnTrailWord(currentX, currentY);
          lastEmitX = currentX;
          lastEmitY = currentY;
        }

        // 4. Move and Scramble/Compile code segments
        const spacing = isHovered ? 11 : 16;
        
        for (let i = 0; i < totalSegments; i++) {
          const seg = segments[i];
          
          const prevX = i === 0 ? currentX : segments[i - 1].x;
          const prevY = i === 0 ? currentY : segments[i - 1].y;
          
          const segmentDx = prevX - seg.x;
          const segmentDy = prevY - seg.y;
          const angle = Math.atan2(segmentDy, segmentDx);
          
          const targetX = prevX - Math.cos(angle) * spacing;
          const targetY = prevY - Math.sin(angle) * spacing;
          
          seg.x += (targetX - seg.x) * 0.65;
          seg.y += (targetY - seg.y) * 0.65;
          
          const sizeOffset = seg.size / 2;
          seg.el.style.transform = `translate3d(${seg.x - sizeOffset}px, ${seg.y - sizeOffset}px, 0)`;

          // SCRAMBLE / COMPILE PHYSICS STATE MACHINE
          if (clickState === 'scrambling') {
            const elapsed = Date.now() - scrambleStartTime;
            const ratio = Math.max(0, 1 - elapsed / 300);
            let rnd = '';
            for (let k = 0; k < seg.originalText.length; k++) {
              rnd += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
            }
            seg.el.innerText = rnd;
            seg.el.style.opacity = seg.baseOpacity * ratio;
          } else if (clickState === 'compiling') {
            const elapsed = Date.now() - compileStartTime;
            const delay = i * 45;
            if (elapsed < delay) {
              seg.el.style.opacity = '0';
            } else if (elapsed >= delay && elapsed < delay + 120) {
              const compileRatio = (elapsed - delay) / 120;
              let rnd = '';
              for (let k = 0; k < seg.originalText.length; k++) {
                rnd += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
              }
              seg.el.innerText = rnd;
              seg.el.style.opacity = seg.baseOpacity * compileRatio;
            } else {
              seg.el.innerText = seg.originalText;
              seg.el.style.opacity = seg.el.classList.contains('hovered') ? 1.0 : seg.baseOpacity;
            }
          } else {
            seg.el.innerText = seg.originalText;
            seg.el.style.opacity = seg.el.classList.contains('hovered') ? 1.0 : seg.baseOpacity;
          }
        }

        // 5. Update floating trail words
        for (let i = trailWords.length - 1; i >= 0; i--) {
          const w = trailWords[i];
          w.x += w.vx;
          w.y += w.vy;
          w.vy -= 0.02;
          w.rotation += w.vRotation;
          w.opacity -= w.decay;
          
          if (w.opacity <= 0) {
            w.el.remove();
            trailWords.splice(i, 1);
          } else {
            w.el.style.transform = `translate3d(${w.x}px, ${w.y}px, 0) rotate(${w.rotation}deg)`;
            w.el.style.opacity = w.opacity;
          }
        }

        // 6. Update glitch particles with physics & real-time character mutations
        for (let i = glitchParticles.length - 1; i >= 0; i--) {
          const p = glitchParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          
          // Dampen velocity with friction & pull slightly downward under gravity
          p.vx *= 0.93;
          p.vy *= 0.93;
          p.vy += 0.08; 
          
          p.rotation += p.vRotation;
          p.scale += p.vScale;
          p.opacity -= p.decay;
          
          if (p.opacity <= 0 || p.scale <= 0) {
            p.el.remove();
            glitchParticles.splice(i, 1);
          } else {
            // Mutate the character content of the glitch particle every 2 frames
            p.mutateCounter++;
            if (p.mutateCounter % 2 === 0) {
              p.el.innerText = GLITCH_GLYPHS[Math.floor(Math.random() * GLITCH_GLYPHS.length)];
            }
            
            p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.rotation}deg) scale(${p.scale})`;
            p.el.style.opacity = p.opacity;
          }
        }

        requestAnimationFrame(updateAnimation);
      }
      
      requestAnimationFrame(updateAnimation);

      // ── HOVER INTERACTIONS ──
      document.addEventListener('mouseover', e => {
        const target = e.target.closest('a, button, .swiper-btn, .swiper-dot, .tech-badge, .swiper-slide, .swiper-thumbnail, .lightbox-close');
        if (target) {
          isHovered = true;
          ring.style.width = '56px';
          ring.style.height = '56px';
          
          if (target.classList.contains('lightbox-close')) {
            ring.style.borderColor = 'rgba(255, 107, 107, 0.8)';
          } else {
            ring.style.borderColor = 'rgba(126, 231, 135, 0.8)';
          }
          
          segments.forEach(seg => {
            seg.el.classList.add('hovered');
          });
        }
      });

      document.addEventListener('mouseout', e => {
        const target = e.target.closest('a, button, .swiper-btn, .swiper-dot, .tech-badge, .swiper-slide, .swiper-thumbnail, .lightbox-close');
        if (target) {
          isHovered = false;
          ring.style.width = '36px';
          ring.style.height = '36px';
          ring.style.borderColor = 'rgba(0, 212, 255, 0.5)';
          
          segments.forEach(seg => {
            seg.el.classList.remove('hovered');
          });
        }
      });
    }

    // ═══════════════════════════════════════════
    // SCROLL TOP
    // ═══════════════════════════════════════════
    const scrollTopBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 300);
    });

    // ═══════════════════════════════════════════
    // FADE-IN OBSERVER
    // ═══════════════════════════════════════════
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('visible');
      });
    }, {
      threshold: 0.1
    });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));

    // ═══════════════════════════════════════════
    // LOAD PROJECT DATA — dari Google Apps Script
    // ═══════════════════════════════════════════
    // Helper function to format Google Drive direct links to stable googleusercontent endpoint wrapped in weserv proxy
    function formatDriveImageUrl(url) {
      if (!url) return '';
      if (url.includes('drive.google.com') || url.includes('docs.google.com') || url.includes('googleusercontent.com')) {
        const matchId = url.match(/\/file\/d\/([^\/]+)/) || url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^\/]+)/);
        if (matchId && matchId[1]) {
          return `https://images.weserv.nl/?url=https://lh3.googleusercontent.com/d/${matchId[1]}`;
        }
      }
      // Check if it's a raw Google Drive ID (alphanumeric, underscores, hyphens, and no dots/slashes)
      if (!url.includes('/') && !url.includes('.') && url.length >= 15 && url.length <= 60) {
        return `https://images.weserv.nl/?url=https://lh3.googleusercontent.com/d/${url}`;
      }
      return url;
    }

    async function initProjectPage() {
      const params    = new URLSearchParams(window.location.search);
      const projectId = params.get('id');

      if (!projectId) { location.replace('index.html'); return; }

      // Create and inject global screen blurred loader overlay
      const globalLoader = document.createElement('div');
      globalLoader.className = 'global-loader';
      globalLoader.id = 'global-loader';
      globalLoader.innerHTML = `
        <div class="skeleton-terminal" style="width: 520px; max-width: 90vw; margin: 0; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
          <div class="skeleton-terminal-header">
            <div class="skeleton-terminal-title">
              <i class="bi bi-terminal"></i> details_fetcher.sh — bash
            </div>
            <div class="skeleton-terminal-dots">
              <span class="skeleton-terminal-dot r"></span>
              <span class="skeleton-terminal-dot y"></span>
              <span class="skeleton-terminal-dot g"></span>
            </div>
          </div>
          <div class="skeleton-terminal-body" id="details-term-body">
            <div class="skeleton-terminal-line cmd">> fetch-detail --id="${projectId}"</div>
            <div class="skeleton-terminal-line info"><span style="color:var(--accent)">[CONNECT]</span> Menghubungkan ke database Firebase...</div>
            <div class="skeleton-terminal-line" id="details-term-sync"><span style="color:#e6db74">[FETCH]</span> Sinkronisasi detail proyek... <span class="skeleton-terminal-cursor"></span></div>
          </div>
        </div>
      `;
      document.body.appendChild(globalLoader);

      const termBody = document.getElementById('details-term-body');
      let stepTimeout1, stepTimeout2;
      
      if (termBody) {
        stepTimeout1 = setTimeout(() => {
          const cursors = termBody.querySelectorAll('.skeleton-terminal-cursor');
          cursors.forEach(c => c.remove());
          const newLine = document.createElement('div');
          newLine.className = 'skeleton-terminal-line info';
          newLine.innerHTML = '<span style="color:#66d9ef">[PARSING]</span> Memetakan objek proyek & gambar... <span class="skeleton-terminal-cursor"></span>';
          termBody.appendChild(newLine);
        }, 600);

        stepTimeout2 = setTimeout(() => {
          const cursors = termBody.querySelectorAll('.skeleton-terminal-cursor');
          cursors.forEach(c => c.remove());
          const newLine = document.createElement('div');
          newLine.className = 'skeleton-terminal-line success';
          newLine.innerHTML = '<span style="color:#a6e22e">[SUCCESS]</span> Rendering halaman detail dimulai... <span class="skeleton-terminal-cursor"></span>';
          termBody.appendChild(newLine);
        }, 1100);
      }

      let project = null;
      try {
        const docRef = doc(db, 'projects', projectId);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          project = docSnap.data();
        } else {
          project = null;
        }
      } catch (err) {
        console.error('Gagal fetch data project:', err);
        clearTimeout(stepTimeout1);
        clearTimeout(stepTimeout2);
        globalLoader.remove();
        document.getElementById('projTitle').textContent    = 'Gagal memuat data';
        document.getElementById('projOverview').textContent = 'Terjadi kesalahan. Pastikan koneksi internet aktif.';
        return;
      }

      if (!project) { location.replace('index.html'); return; }

      // Clear timeouts and remove loader
      clearTimeout(stepTimeout1);
      clearTimeout(stepTimeout2);
      globalLoader.classList.add('fade-out');
      setTimeout(() => {
        globalLoader.remove();
      }, 400);

      // ── Isi semua elemen HTML ──
      document.title = `${project.title} — Faizal Dwi Al Farizi`;
      document.getElementById('pageHeroTitle').textContent  = project.title;
      document.getElementById('breadcrumbTitle').textContent = project.title;
      document.getElementById('projTitle').textContent      = project.title;
      document.getElementById('projCat').textContent        = project.category;
      document.getElementById('projDate').textContent       = project.date;
      document.getElementById('projClient').textContent     = project.client;
      document.getElementById('projOverview').textContent   = project.overview;

      // URL
      const urlEl  = document.getElementById('projUrl');
      const urlTxt = document.getElementById('projUrlText');
      const viewLink = document.getElementById('viewLink');

      const isJavaScript = project.website.startsWith('javascript:');
      if (isJavaScript) {
        // Extract the alert message (e.g., "Program ini sudah menjadi milik CV. Rosin")
        const alertMsg = project.website.match(/alert\(['"](.*?)['"]\)/)?.[1] || "Proyek bersifat privat.";
        
        urlEl.href = '#';
        urlTxt.textContent = alertMsg;
        urlEl.removeAttribute('target');
        
        viewLink.href = '#';
        viewLink.removeAttribute('target');
        
        const triggerAlert = (e) => {
          e.preventDefault();
          alert(alertMsg);
        };
        urlEl.addEventListener('click', triggerAlert);
        viewLink.addEventListener('click', triggerAlert);
      } else {
        urlEl.href         = project.website;
        urlTxt.textContent = project.website;
        urlEl.setAttribute('target', '_blank');
        
        viewLink.href = project.website;
        viewLink.setAttribute('target', '_blank');
      }

      // Tech badges
      document.getElementById('techBadges').innerHTML = project.tech
        .map(t => `<span class="tech-badge">${t}</span>`).join('');

      // Features grid
      document.getElementById('featuresGrid').innerHTML = project.features
        .map(f => `<div class="feature-item">${f}</div>`).join('');

      // ─── CUSTOM SWIPER ───
      const images = (project.images && project.images.length > 0
        ? project.images : ['assets/img/icon.webp']).map(img => formatDriveImageUrl(img));
      let currentIdx = 0;

      const wrapperEl = document.getElementById('swiperWrapper');
      const dotsEl    = document.getElementById('swiperDots');
      const thumbsEl  = document.getElementById('swiperThumbnails');
      const btnPrev   = document.getElementById('swBtnPrev');
      const btnNext   = document.getElementById('swBtnNext');

      // Build slides inside swiperWrapper
      function buildSlides() {
        wrapperEl.innerHTML = images.map((img, i) => 
          `<img src="${img}" alt="${project.title}" class="swiper-slide${i === 0 ? ' active' : ''}" />`
        ).join('');
      }

      function buildDots() {
        dotsEl.innerHTML = '';
        if (images.length <= 1) { dotsEl.style.display = 'none'; return; }
        images.forEach((_, i) => {
          const d = document.createElement('button');
          d.className = 'swiper-dot' + (i === 0 ? ' active' : '');
          d.addEventListener('click', () => goTo(i));
          dotsEl.appendChild(d);
        });
      }

      function buildThumbnails() {
        thumbsEl.innerHTML = '';
        if (images.length <= 1) { thumbsEl.style.display = 'none'; return; }
        
        // Responsiveness adjustment: if too many images, use flex-start to prevent cutting off, else center
        if (images.length > 4) {
          thumbsEl.style.justifyContent = 'flex-start';
        } else {
          thumbsEl.style.justifyContent = 'center';
        }

        images.forEach((img, i) => {
          const t = document.createElement('img');
          t.src = img;
          t.alt = `Thumbnail ${i + 1}`;
          t.className = 'swiper-thumbnail' + (i === 0 ? ' active' : '');
          t.addEventListener('click', () => goTo(i));
          thumbsEl.appendChild(t);
        });
      }

      function updateControls() {
        // Update dots
        dotsEl.querySelectorAll('.swiper-dot').forEach((d, i) => {
          d.classList.toggle('active', i === currentIdx);
        });

        // Update thumbnails
        thumbsEl.querySelectorAll('.swiper-thumbnail').forEach((t, i) => {
          t.classList.toggle('active', i === currentIdx);
        });
      }

      function goTo(idx) {
        if (images.length <= 1) return;
        
        // Remove active class from old slide
        const slides = wrapperEl.querySelectorAll('.swiper-slide');
        slides[currentIdx].classList.remove('active');

        // Set new index
        currentIdx = (idx + images.length) % images.length;

        // Add active class to new slide
        slides[currentIdx].classList.add('active');

        updateControls();
      }

      // Initialize
      buildSlides();
      buildDots();
      buildThumbnails();

      if (images.length <= 1) {
        btnPrev.style.display = 'none';
        btnNext.style.display = 'none';
      } else {
        btnPrev.addEventListener('click', () => goTo(currentIdx - 1));
        btnNext.addEventListener('click', () => goTo(currentIdx + 1));
      }

      // ─── LIGHTBOX MODAL TRIGGER ───
      const modal = document.getElementById('lightboxModal');
      const modalImg = document.getElementById('lightboxImg');
      const captionText = document.getElementById('lightboxCaption');
      const closeBtn = document.getElementById('lightboxClose');

      // Click event for slides inside swiperWrapper
      wrapperEl.addEventListener('click', e => {
        const slide = e.target.closest('.swiper-slide');
        if (slide) {
          modal.style.display = 'flex';
          void modal.offsetWidth; // Force reflow for smooth transition
          modal.classList.add('open');
          
          modalImg.src = slide.src;
          modalImg.alt = slide.alt;
          captionText.textContent = `${project.title} — Gambar ${currentIdx + 1} dari ${images.length}`;
          
          document.body.style.overflow = 'hidden';
        }
      });

      // Close modal function
      function closeModal() {
        modal.classList.remove('open');
        magnifier.style.display = 'none'; // Reset magnifier visibility when closing
        setTimeout(() => {
          modal.style.display = 'none';
          document.body.style.overflow = '';
        }, 300);
      }

      // ─── MAGNIFIER & SLIDER CONTROL ───
      const magnifier   = document.getElementById('lightboxMagnifier');
      const zoomSlider  = document.getElementById('zoomSlider');
      const zoomValue   = document.getElementById('zoomValue');

      // Update zoom label dynamically
      zoomSlider.addEventListener('input', () => {
        zoomValue.textContent = `${parseFloat(zoomSlider.value).toFixed(1)}x`;
      });

      // Track mouseover to render the glass lens position and zoomed background
      modalImg.addEventListener('mousemove', e => {
        const rect = modalImg.getBoundingClientRect();
        
        // Calculate relative coordinates on the image
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Position magnifier circle (center it on mouse position)
        magnifier.style.display = 'block';
        magnifier.style.left = `${e.clientX - 90}px`; // 90px is half of 180px width
        magnifier.style.top = `${e.clientY - 90}px`;

        // Get zoom power from the cyberpunk range slider
        const zoom = parseFloat(zoomSlider.value);

        // Render zoomed background image segment
        magnifier.style.backgroundImage = `url('${modalImg.src}')`;
        magnifier.style.backgroundSize = `${rect.width * zoom}px ${rect.height * zoom}px`;
        
        // Calculate background alignment percentages
        const bgX = (x / rect.width) * 100;
        const bgY = (y / rect.height) * 100;
        magnifier.style.backgroundPosition = `${bgX}% ${bgY}%`;
      });

      // Hide magnifier glass when leaving image area
      modalImg.addEventListener('mouseleave', () => {
        magnifier.style.display = 'none';
      });

      // Allow scroll wheel inside the image area to adjust zoom power slider!
      modalImg.addEventListener('wheel', e => {
        e.preventDefault();
        let val = parseFloat(zoomSlider.value);
        if (e.deltaY < 0) {
          val = Math.min(4.0, val + 0.2); // Scroll up: Zoom in
        } else {
          val = Math.max(1.5, val - 0.2); // Scroll down: Zoom out
        }
        zoomSlider.value = val;
        zoomValue.textContent = `${val.toFixed(1)}x`;

        // Manually trigger mousemove calculations to update magnifier display immediately
        const mouseEvent = new MouseEvent('mousemove', {
          clientX: e.clientX,
          clientY: e.clientY,
          bubbles: true
        });
        modalImg.dispatchEvent(mouseEvent);
      }, { passive: false });

      closeBtn.addEventListener('click', closeModal);

      // Close on background click
      modal.addEventListener('click', e => {
        if (e.target === modal || e.target === captionText) {
          closeModal();
        }
      });

      // Close on ESC key press
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('open')) {
          closeModal();
        }
      });
    }

    // Panggil saat halaman siap
    initProjectPage();
  </script>
